<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer hex ring -->
  <polygon points="50,2 95,26 95,74 50,98 5,74 5,26"
    fill="none" stroke="url(#hexGrad)" stroke-width="2.5" opacity="0.5"/>
  <!-- Filled hex -->
  <polygon points="50,8 89,29 89,71 50,92 11,71 11,29"
    fill="url(#hexGrad)"/>
  <!-- SD text -->
  <text x="50" y="57"
    dominant-baseline="middle" text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="35" font-weight="900" fill="white" letter-spacing="-2"
    filter="url(#glow)">SD</text>
</svg>
