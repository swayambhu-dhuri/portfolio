  <rect x="172" y="128" width="82" height="38" rx="8" fill="#0f1629" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="178" y="134" width="20" height="12" rx="2" fill="#16a34a"/>
  <text x="178" y="144" font-family="sans-serif" font-size="7" fill="#fff">BofA</text>
  <text x="204" y="138" font-family="sans-serif" font-size="8" fill="#e2e8f0">$9,183</text>
