<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow-f" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="100" height="100" rx="16" fill="#0a0818"/>

  <!-- Glowing S (purple, offset left) -->
  <text x="14" y="66"
    font-family="Arial Black, Arial, sans-serif"
    font-size="62" font-weight="900"
    fill="#915EFF" opacity="0.92"
    filter="url(#glow-f)">S</text>

  <!-- Glowing D (teal, offset right) with screen blend -->
  <text x="44" y="66"
    font-family="Arial Black, Arial, sans-serif"
    font-size="62" font-weight="900"
    fill="#06B6D4" opacity="0.88"
    style="mix-blend-mode:screen"
    filter="url(#glow-soft)">D</text>

  <!-- Thin gradient underline accent -->
  <defs>
    <linearGradient id="underline-f" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#915EFF"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect x="12" y="74" width="76" height="2.5" rx="1.25" fill="url(#underline-f)" opacity="0.7"/>
</svg>
