<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Very dark terminal-green-black background -->
  <rect width="100" height="100" rx="16" fill="#050d0e"/>
  <!-- Subtle teal border -->
  <rect x="1.5" y="1.5" width="97" height="97" rx="15"
    fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.35"/>
  <!-- Faint scanline rows for CRT texture -->
  <rect x="0" y="0" width="100" height="100" rx="16"
    fill="url(#scanlines)" opacity="0.06"/>
  <!-- $ prompt in teal -->
  <text x="11" y="57"
    font-family="Courier New, Lucida Console, monospace"
    font-size="22" font-weight="700" fill="#06B6D4">$</text>
  <!-- space then sd in purple -->
  <text x="34" y="57"
    font-family="Courier New, Lucida Console, monospace"
    font-size="22" font-weight="700" fill="#a78bfa">sd</text>
  <!-- Blinking cursor block -->
  <rect x="70" y="38" width="13" height="20" rx="2" fill="#06B6D4" opacity="0.85"/>
  <!-- Bottom status line dots -->
  <circle cx="18" cy="76" r="2.5" fill="#06B6D4" opacity="0.5"/>
  <circle cx="26" cy="76" r="2.5" fill="#06B6D4" opacity="0.3"/>
  <circle cx="34" cy="76" r="2.5" fill="#06B6D4" opacity="0.15"/>
</svg>
