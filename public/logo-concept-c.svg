<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0a0818"/>
    </radialGradient>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="49" fill="url(#bgGrad)"/>
  <circle cx="50" cy="50" r="48" fill="none" stroke="#2d1b6b" stroke-width="1"/>

  <!-- ── Edges (drawn before nodes so nodes sit on top) ── -->
  <!-- S-side edges (purple) -->
  <line x1="22" y1="24" x2="52" y2="24" stroke="#915EFF" stroke-width="1.4" opacity="0.7" filter="url(#lineGlow)"/>
  <line x1="22" y1="24" x2="18" y2="50" stroke="#915EFF" stroke-width="1.4" opacity="0.7" filter="url(#lineGlow)"/>
  <line x1="52" y1="24" x2="52" y2="50" stroke="#915EFF" stroke-width="1.4" opacity="0.5"/>
  <line x1="18" y1="50" x2="52" y2="50" stroke="#915EFF" stroke-width="1.4" opacity="0.7" filter="url(#lineGlow)"/>
  <line x1="18" y1="50" x2="22" y2="76" stroke="#915EFF" stroke-width="1.4" opacity="0.5"/>
  <line x1="22" y1="76" x2="52" y2="76" stroke="#915EFF" stroke-width="1.4" opacity="0.7" filter="url(#lineGlow)"/>

  <!-- D-side edges (teal) -->
  <line x1="52" y1="24" x2="74" y2="35" stroke="#06B6D4" stroke-width="1.4" opacity="0.7" filter="url(#lineGlow)"/>
  <line x1="74" y1="35" x2="80" y2="50" stroke="#06B6D4" stroke-width="1.4" opacity="0.7" filter="url(#lineGlow)"/>
  <line x1="80" y1="50" x2="74" y2="65" stroke="#06B6D4" stroke-width="1.4" opacity="0.7" filter="url(#lineGlow)"/>
  <line x1="74" y1="65" x2="52" y2="76" stroke="#06B6D4" stroke-width="1.4" opacity="0.7" filter="url(#lineGlow)"/>
  <line x1="52" y1="76" x2="52" y2="50" stroke="#06B6D4" stroke-width="1.4" opacity="0.5"/>

  <!-- ── Nodes ── -->
  <!-- S-side nodes (purple) -->
  <circle cx="22" cy="24" r="5" fill="#7C3AED" filter="url(#nodeGlow)"/>
  <circle cx="52" cy="24" r="5" fill="#7C3AED" filter="url(#nodeGlow)"/>
  <circle cx="18" cy="50" r="5" fill="#915EFF" filter="url(#nodeGlow)"/>
  <circle cx="22" cy="76" r="5" fill="#7C3AED" filter="url(#nodeGlow)"/>
  <circle cx="52" cy="76" r="5" fill="#7C3AED" filter="url(#nodeGlow)"/>

  <!-- Center pivot node (shared) -->
  <circle cx="52" cy="50" r="6" fill="white" filter="url(#nodeGlow)" opacity="0.9"/>

  <!-- D-side nodes (teal) -->
  <circle cx="74" cy="35" r="5" fill="#06B6D4" filter="url(#nodeGlow)"/>
  <circle cx="80" cy="50" r="5" fill="#0891B2" filter="url(#nodeGlow)"/>
  <circle cx="74" cy="65" r="5" fill="#06B6D4" filter="url(#nodeGlow)"/>
</svg>
